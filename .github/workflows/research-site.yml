name: research-site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the public review source
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=zip --output="$RUNNER_TEMP/review-source/source.zip" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/review-source/IDENTITY.txt"
          sha256sum "$RUNNER_TEMP/review-source/source.zip" | sed 's@  .*/@  @' > "$RUNNER_TEMP/review-source/SHA256SUMS"
      - name: Preserve the exact public review source
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: research-site-review-source
          path: ${{ runner.temp }}/review-source
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/site/package-lock.json
      - name: Install locked browser-only test dependencies
        run: npm ci --prefix tools/site --ignore-scripts --no-audit --no-fund
      - name: Offline primary-data, English-only, geometry and renderer tests
        run: |
          python -B tools/site/test_site.py
          python -O -B tools/site/test_site.py
          python -B tools/build_optimizer_story.py --verify
          python -O -B tools/build_optimizer_story.py --verify
          python -B -m unittest discover -s tests -p test_optimization_story.py
          python -O -B -m unittest discover -s tests -p test_optimization_story.py
          python -B -m unittest discover -s tests -p test_presentation_review.py
          python -O -B -m unittest discover -s tests -p test_presentation_review.py
          node --test tools/site/test_core.mjs
          python -B tools/build_research_site.py --out "$RUNNER_TEMP/proton-site"
      - name: Browser, animation, accessibility and English-film acceptance
        env:
          CHROME_BIN: /usr/bin/google-chrome
          REQUIRE_FILMS: '1'
        run: |
          python -m http.server 8768 --bind 127.0.0.1 --directory "$RUNNER_TEMP/proton-site" > "$RUNNER_TEMP/site-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER_DEPS="$PWD/tools/site" SITE_URL=http://127.0.0.1:8768/ QA_OUT="$RUNNER_TEMP/cinematic-qa" node tools/site/browser_test.mjs
          BROWSER_DEPS="$PWD/tools/site" SITE_URL=http://127.0.0.1:8768/ QA_OUT="$RUNNER_TEMP/cinematic-qa/offpath" node tools/site/browser_offpath_test.mjs
          BROWSER_DEPS="$PWD/tools/site" SITE_URL=http://127.0.0.1:8768/ QA_OUT="$RUNNER_TEMP/cinematic-qa/optimization" node tools/site/browser_optimization_test.mjs
      - name: Full-width accessibility and controlled before-after review
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          git fetch --no-tags --depth=1 origin f5f4784d7cc186ae9cfcacbd97117b5dabbffb30 d37e7ceb209f0eb68fa4e36a0bec5af20e58fc35
          for ITEM in baseline:f5f4784d7cc186ae9cfcacbd97117b5dabbffb30 before:d37e7ceb209f0eb68fa4e36a0bec5af20e58fc35; do
            NAME="${ITEM%%:*}"
            REF="${ITEM#*:}"
            mkdir -p "$RUNNER_TEMP/review-$NAME-src"
            git archive "$REF" | tar -x -C "$RUNNER_TEMP/review-$NAME-src"
            PROTON_SOURCE_REF=f5f4784d7cc186ae9cfcacbd97117b5dabbffb30 python "$RUNNER_TEMP/review-$NAME-src/tools/build_research_site.py" --out "$RUNNER_TEMP/review-$NAME-site"
          done
          python -m http.server 8768 --bind 127.0.0.1 --directory "$RUNNER_TEMP/proton-site" > "$RUNNER_TEMP/review-current.log" 2>&1 &
          CURRENT=$!
          python -m http.server 8769 --bind 127.0.0.1 --directory "$RUNNER_TEMP/review-baseline-site" > "$RUNNER_TEMP/review-baseline.log" 2>&1 &
          BASELINE=$!
          python -m http.server 8770 --bind 127.0.0.1 --directory "$RUNNER_TEMP/review-before-site" > "$RUNNER_TEMP/review-before.log" 2>&1 &
          BEFORE=$!
          trap 'kill "$CURRENT" "$BASELINE" "$BEFORE" 2>/dev/null || true' EXIT
          BROWSER_DEPS="$PWD/tools/site" SITE_URL=http://127.0.0.1:8768/ REVIEW_BASELINE_URL=http://127.0.0.1:8769/ REVIEW_BEFORE_URL=http://127.0.0.1:8770/ QA_OUT="$RUNNER_TEMP/cinematic-qa/presentation-review" node tools/site/browser_review_test.mjs
      - name: Preserve the tested non-production preview
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: research-site-preview
          path: ${{ runner.temp }}/proton-site
          retention-days: 14
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-site-browser-qa
          path: |
            ${{ runner.temp }}/cinematic-qa
            ${{ runner.temp }}/site-server.log
          retention-days: 14
      - name: Upload the tested Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/proton-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
