name: research-site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/site/package-lock.json
      - name: Install locked browser-only test dependencies
        run: npm ci --prefix tools/site --ignore-scripts --no-audit --no-fund
      - name: Offline primary-data, English-only, geometry and renderer tests
        run: |
          python -B tools/site/test_site.py
          python -O -B tools/site/test_site.py
          node --test tools/site/test_core.mjs
          python -B tools/build_research_site.py --out "$RUNNER_TEMP/proton-site"
      - name: Browser, animation, accessibility and English-film acceptance
        env:
          CHROME_BIN: /usr/bin/google-chrome
          REQUIRE_FILMS: '1'
        run: |
          python -m http.server 8768 --bind 127.0.0.1 --directory "$RUNNER_TEMP/proton-site" > "$RUNNER_TEMP/site-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER_DEPS="$PWD/tools/site" SITE_URL=http://127.0.0.1:8768/ QA_OUT="$RUNNER_TEMP/cinematic-qa" node tools/site/browser_test.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-site-browser-qa
          path: |
            ${{ runner.temp }}/cinematic-qa
            ${{ runner.temp }}/site-server.log
          retention-days: 14
      - name: Upload the tested Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/proton-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
